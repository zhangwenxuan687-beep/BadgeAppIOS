name: BadgeAppIOS
options:
  bundleIdPrefix: com.lab7
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  BadgeAppIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab7.badgeios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AI Badge
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleName: BadgeAppIOS
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: 连接 AI-Badge-BLE 挂件，接收麦克风音频与摄像头画面，并下发 TTS 语音。
        NSBluetoothPeripheralUsageDescription: 连接 AI-Badge-BLE 挂件。
        NSMicrophoneUsageDescription: 语音识别需要使用麦克风权限（实际音频来自挂件，经蓝牙传输）。
        NSSpeechRecognitionUsageDescription: 将挂件麦克风语音转成文字，优先使用端侧语音识别。
        NSLocalNetworkUsageDescription: 访问同一局域网内的 llama-server 大模型服务。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - bluetooth-central

schemes:
  BadgeAppIOS:
    build:
      targets:
        BadgeAppIOS: all
    run:
      config: Debug
    archive:
      config: Release
