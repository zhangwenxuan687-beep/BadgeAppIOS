name: Build unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project BadgeAppIOS.xcodeproj \
            -scheme BadgeAppIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload BadgeAppIOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BadgeAppIOS-unsigned.ipa Payload
          ls -lh BadgeAppIOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadgeAppIOS-unsigned-ipa
          path: BadgeAppIOS-unsigned.ipa
          if-no-files-found: error
